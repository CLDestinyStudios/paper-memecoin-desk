name: paper-desk
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: desk
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests
      - name: Paper desk loop (~5h40m, one cycle every 5 min)
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            START=$(date +%s)
            git pull -q --rebase origin main || git rebase --abort || true
            echo "=== $(date) [actions] ===" >> loop.log
            timeout 300 python desk.py cycle >> loop.log 2>&1 || echo "cycle exit $?" >> loop.log
            tail -n 2000 loop.log > loop.log.trim && mv loop.log.trim loop.log
            tail -n 3 loop.log
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "desk cycle $(date '+%Y-%m-%d %H:%M %Z')"
              for i in 1 2 3 4 5; do
                if git push -q origin HEAD:main; then echo "pushed"; break; fi
                git pull -q --rebase -X theirs origin main || { git rebase --abort; sleep 5; }
                sleep $((i*3))
              done
            fi
            LEFT=$(( 300 - ($(date +%s) - START) ))
            NOWLEFT=$(( END - $(date +%s) ))
            [ "$NOWLEFT" -le 0 ] && break
            [ "$LEFT" -gt "$NOWLEFT" ] && LEFT=$NOWLEFT
            [ "$LEFT" -gt 0 ] && sleep "$LEFT"
          done
